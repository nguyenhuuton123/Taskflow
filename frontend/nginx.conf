server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: mọi đường dẫn không phải file đều về index.html
  location / {
    try_files $uri /index.html;
  }

  # API và tài liệu Swagger đi qua backend (cùng origin => không cần CORS)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /docs { proxy_pass http://backend:8000; }
  location = /openapi.yaml { proxy_pass http://backend:8000; }
}
